<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>oh-my-web is offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1a1a1a;
        color: #e8e8e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        color: #9ca3af;
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 40px;
        padding: 0 20px;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        background: #242424;
        color: #e8e8e8;
        font: inherit;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      button:hover {
        background: #2e2e2e;
        border-color: #4a4a4a;
      }

      button:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>oh-my-web is offline</h1>
      <p>Reconnect to the local oh-my-web server, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
